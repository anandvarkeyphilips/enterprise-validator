name: Keep production warm

# The App Service free tier unloads the app after ~20 minutes without
# traffic; the next visitor then pays a ~2 minute cold start. Pinging the
# health endpoint on a schedule keeps the site responsive.
on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: curl -sSf -m 120 https://enterprise-validator.azurewebsites.net/actuator/health
