name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    name: Build, test, e2e and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Verify (formatter, tests, JaCoCo 90%, PIT 90%)
        run: ./mvnw -B -ntp clean verify -P '!sonarqube-scanner'

      - name: Static analysis on SonarCloud
        if: env.SONAR_TOKEN != ''
        # Non-blocking until Automatic Analysis is disabled in the SonarCloud UI
        # (Administration > Analysis Method) - CI analysis and AutoScan are exclusive.
        continue-on-error: true
        run: ./mvnw -B -ntp -DskipTests org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run e2e tests against the packaged jar
        run: npx playwright test
        working-directory: e2e

      - name: Azure login via OIDC federation
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy jar to the App Service
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          az webapp deploy \
            --name enterprise-validator \
            --resource-group enterprise-validator-app-service \
            --src-path "$(ls target/enterprise-validator-*.jar)" \
            --type jar

      - name: Smoke test the live site
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          for i in $(seq 1 24); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -m 15 https://enterprise-validator.azurewebsites.net/actuator/health || true)
            body=$(curl -s -m 15 https://enterprise-validator.azurewebsites.net/actuator/health || true)
            if [ "$body" = '{"status":"UP"}' ]; then echo "Site is UP"; exit 0; fi
            echo "attempt $i: status=$status body=$body"; sleep 10
          done
          echo "Site did not become healthy in time"; exit 1

  publish-central:
    name: Publish release to Maven Central
    runs-on: ubuntu-latest
    needs: pipeline
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Import GPG signing key
        run: echo -e "${{ secrets.VARKEYS_EV_MAVEN_GPG_SECRET_KEY }}" | gpg --batch --import

      - name: Write Maven settings for Central Portal
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.CENTRAL_PORTAL_USERNAME }}</username>
                <password>${{ secrets.CENTRAL_PORTAL_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build, sign and publish to Maven Central
        run: >
          ./mvnw -B -ntp -P maven-central-publish deploy
          -Dgpg.passphrase="${{ secrets.VARKEYS_EV_MAVEN_GPG_PASSPHRASE }}"

      - name: Create GitHub release from the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" || echo "Release already exists"
