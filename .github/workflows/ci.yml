name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests, coverage and mutation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25 (Azul Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Verify (formatter, tests, JaCoCo 90%, PIT 90%)
        run: ./mvnw -B -ntp clean verify -P '!sonarqube-scanner'

      - name: Upload jar for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/enterprise-validator-*.jar
          retention-days: 3

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25 (Azul Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Download jar from the build job
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run e2e tests against the packaged jar
        run: npx playwright test
        working-directory: e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
