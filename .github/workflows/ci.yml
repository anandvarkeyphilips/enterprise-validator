name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests, coverage and mutation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Verify (formatter, tests, JaCoCo 90%, PIT 90%)
        run: ./mvnw -B -ntp clean verify -P '!sonarqube-scanner'

      - name: Upload jar for the e2e job
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/enterprise-validator-*.jar
          retention-days: 3

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'

      - name: Download jar from the build job
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: target

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run e2e tests against the packaged jar
        run: npx playwright test
        working-directory: e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to Azure App Service (OIDC)
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login via OIDC federation
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download jar from the build job
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: artifact

      - name: Deploy jar to the App Service
        run: |
          az webapp deploy \
            --name enterprise-validator \
            --resource-group enterprise-validator-app-service \
            --src-path "$(ls artifact/enterprise-validator-*.jar)" \
            --type jar

      - name: Smoke test the live site
        run: |
          for i in $(seq 1 24); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -m 15 https://enterprise-validator.azurewebsites.net/actuator/health || true)
            body=$(curl -s -m 15 https://enterprise-validator.azurewebsites.net/actuator/health || true)
            if [ "$body" = '{"status":"UP"}' ]; then echo "Site is UP"; exit 0; fi
            echo "attempt $i: status=$status body=$body"; sleep 10
          done
          echo "Site did not become healthy in time"; exit 1

  publish-central:
    name: Publish release to Maven Central
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Import GPG signing key
        run: echo -e "${{ secrets.VARKEYS_EV_MAVEN_GPG_SECRET_KEY }}" | gpg --batch --import

      - name: Write Maven settings for Central Portal
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.CENTRAL_PORTAL_USERNAME }}</username>
                <password>${{ secrets.CENTRAL_PORTAL_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build, sign and publish to Maven Central
        run: >
          ./mvnw -B -ntp -P maven-central-publish deploy
          -Dgpg.passphrase="${{ secrets.VARKEYS_EV_MAVEN_GPG_PASSPHRASE }}"

